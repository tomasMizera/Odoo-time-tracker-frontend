const { useState, useEffect, useRef } = React;

function ProjectSelect({ value, onChange, projects, recentProjectIds, style, placeholder }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const [openUp, setOpenUp] = useState(false);
  const ref = useRef(null);
  const selected = projects.find(p => p.id === value) || null;

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setSearch(""); } };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const handleToggle = () => {
    if (!open && ref.current) {
      const rect = ref.current.getBoundingClientRect();
      setOpenUp(window.innerHeight - rect.bottom < 260);
    }
    setOpen(o => !o);
  };

  const recentProjects = projects.filter(p => recentProjectIds.has(p.id));
  const otherProjects = projects.filter(p => !recentProjectIds.has(p.id));
  const q = search.toLowerCase();
  const showRecent = search ? recentProjects.filter(p => p.name.toLowerCase().includes(q)) : recentProjects;
  const showOthers = search ? otherProjects.filter(p => p.name.toLowerCase().includes(q)) : [];

  const pick = (project) => { onChange(project); setOpen(false); setSearch(""); };

  const rowStyle = { padding:"6px 10px", fontSize:12, color:"var(--text)", cursor:"pointer" };
  const sectionLbl = { fontSize:10, color:"var(--text-lo)", padding:"5px 10px 2px", textTransform:"uppercase", fontWeight:700, letterSpacing:"0.05em" };

  return (
    <div ref={ref} style={{ position:"relative" }}>
      <div onClick={handleToggle} style={{ ...style, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer", userSelect:"none" }}>
        <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", color: selected ? "var(--text)" : "var(--text-lo)" }}>
          {selected ? selected.name : (placeholder || "Project…")}
        </span>
        <span style={{ fontSize:10, color:"var(--text-lo)", marginLeft:4, flexShrink:0 }}>▾</span>
      </div>
      {open && (
        <div style={{ position:"absolute", ...(openUp ? { bottom:"calc(100% + 2px)" } : { top:"calc(100% + 2px)" }), left:0, right:0, zIndex:1000, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, boxShadow:"var(--shadow)", overflow:"hidden", minWidth:200 }}>
          <input autoFocus value={search} onChange={e => setSearch(e.target.value)}
            onKeyDown={e => { if (e.key === "Escape") { setOpen(false); setSearch(""); } }}
            placeholder="Search all projects…"
            style={{ width:"100%", background:"var(--well)", border:"none", borderBottom:"1px solid var(--border)", padding:"7px 10px", color:"var(--text)", fontSize:12, outline:"none" }} />
          <div style={{ overflowY:"auto", maxHeight:220 }}>
            <div onClick={() => pick(null)} style={{ ...rowStyle, color:"var(--text-lo)" }}
              onMouseEnter={e => e.currentTarget.style.background="var(--well)"}
              onMouseLeave={e => e.currentTarget.style.background="transparent"}>— none —</div>
            {showRecent.length > 0 && (
              <>
                <div style={sectionLbl}>Recent</div>
                {showRecent.map(p => (
                  <div key={p.id} onClick={() => pick(p)} style={rowStyle}
                    onMouseEnter={e => e.currentTarget.style.background="var(--well)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>{p.name}</div>
                ))}
              </>
            )}
            {showOthers.length > 0 && (
              <>
                <div style={{ ...sectionLbl, borderTop:"1px solid var(--border)", paddingTop:6 }}>All Projects</div>
                {showOthers.map(p => (
                  <div key={p.id} onClick={() => pick(p)} style={rowStyle}
                    onMouseEnter={e => e.currentTarget.style.background="var(--well)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>{p.name}</div>
                ))}
              </>
            )}
            {!search && recentProjects.length === 0 && <div style={{ ...rowStyle, color:"var(--text-lo)" }}>No recent projects — search above</div>}
            {search && showRecent.length === 0 && showOthers.length === 0 && <div style={{ padding:"10px", fontSize:12, color:"var(--text-lo)", textAlign:"center" }}>No projects match</div>}
          </div>
        </div>
      )}
    </div>
  );
}

const BASE = "http://localhost:3010";

async function odooRPC(method, args) {
  const res = await fetch(`${BASE}/jsonrpc`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "call", params: { service: args[0], method: args[1], args: args[2] } })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.data?.message || data.error.message || "Odoo error");
  return data.result;
}

async function keychainGet() {
  const res = await fetch(`${BASE}/keychain/creds`);
  return res.json();
}
async function keychainSave(creds, anthropicKey, userContext) {
  await fetch(`${BASE}/keychain/creds`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ creds, anthropicKey, userContext })
  });
}
async function keychainDelete() {
  await fetch(`${BASE}/keychain/delete`, { method: "POST" });
}

function projectColor(name) {
  if (!name) return "#6b7280";
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}

function fmtDate(d) {
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}

function todayISO() { return new Date().toISOString().split("T")[0]; }

function weekStartOf(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d.toISOString().split("T")[0];
}

function weekDaysOf(dateStr) {
  const start = new Date(weekStartOf(dateStr));
  return Array.from({length:7}, (_,i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d.toISOString().split("T")[0];
  });
}

function App() {
  const [tab, setTab] = useState("Log Time");
  const [creds, setCreds] = useState(null);
  const [anthropicKey, setAnthropicKey] = useState("");
  const [uid, setUid] = useState(null);
  const [projects, setProjects] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [booting, setBooting] = useState(true);
  const [userContext, setUserContext] = useState("");
  const [monthlyHours, setMonthlyHours] = useState(null);
  const [recentProjectIds, setRecentProjectIds] = useState(new Set());
  const [showMonthsPopup, setShowMonthsPopup] = useState(false);
  const [monthsData, setMonthsData] = useState(null);
  const [monthsLoading, setMonthsLoading] = useState(false);

  const [darkMode, setDarkMode] = useState(() => {
    const s = localStorage.getItem("odoo-tracker-theme");
    if (s) return s === "dark";
    return window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
  });
  const [palette, setPalette] = useState(() => localStorage.getItem("odoo-tracker-palette") || "forest");

  useEffect(() => {
    document.body.setAttribute("data-theme", darkMode ? "dark" : "light");
    localStorage.setItem("odoo-tracker-theme", darkMode ? "dark" : "light");
    const pal = PALETTES.find(p => p.id === palette) || PALETTES[0];
    const v = darkMode ? pal.dark : pal.light;

    b.style.setProperty("--accent", v.accent);
    b.style.setProperty("--accent-hi", v.accentHi);
    b.style.setProperty("--accent-gradient", v.gradient);
    b.style.setProperty("--accent-text", v.text);
    b.style.setProperty("--accent-text-hi", v.textHi);
    b.style.setProperty("--accent-text-lo", v.textLo);
    b.style.setProperty("--border-accent", v.border);
  }, [darkMode, palette]);

  const [aiInput, setAiInput] = useState("");
  const [parsedEntries, setParsedEntries] = useState([]);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const [submitStatus, setSubmitStatus] = useState("");

  const [quickEntry, setQuickEntry] = useState(() => {

  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [editStatus, setEditStatus] = useState("");

  const [cellEditKey, setCellEditKey] = useState(null);
  const [cellEditVal, setCellEditVal] = useState("");

  const [rowTooltip, setRowTooltip] = useState(null);

  const [tableDate, setTableDate] = useState(todayISO());
  const [tableEntries, setTableEntries] = useState([]);
  const [tableLoading, setTableLoading] = useState(false);
  const [weekEntries, setWeekEntries] = useState([]);
  const [weekLoading, setWeekLoading] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const { creds: c, anthropicKey: ak, userContext: uc } = await keychainGet();

      setBooting(false);
    })();

  useEffect(() => {
    if (creds?.url && creds?.db && creds?.email && creds?.password) doAuth();
  }, [creds]);

  async function doAuth() {
    try {
      const id = await odooRPC("call", ["common", "authenticate", [creds.db, creds.email, creds.password, {}]]);
      if (id) { setUid(id); fetchData(id); } else setUid(null);
    } catch { setUid(null); }
  }

  async function fetchData(id) {
    try {
      const projs = await odooRPC("call", ["object", "execute_kw", [creds.db, id, creds.password, "project.project", "search_read", [[["active","=",true]]], { fields: ["id","name"], limit: 200 }]]);
      setProjects(projs || []);
      const tsk = await odooRPC("call", ["object", "execute_kw", [creds.db, id, creds.password, "project.task", "search_read", [[["active","=",true]]], { fields: ["id","name","project_id"], limit: 500 }]]);
      setTasks(tsk || []);

      const now = new Date();
      const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-01`;
      const [monthEntries, recentEntries] = await Promise.all([
        odooRPC("call", ["object", "execute_kw", [creds.db, id, creds.password, "account.analytic.line", "search_read",
          [[["date",">=",monthStart],["date","<=",todayISO()],["user_id.login","=",creds.email]]],
          { fields: ["unit_amount"], limit: 2000 }]]),
        odooRPC("call", ["object", "execute_kw", [creds.db, id, creds.password, "account.analytic.line", "search_read",
          [[["date",">=", (() => { const d=new Date(); d.setDate(d.getDate()-28); return d.toISOString().split("T")[0]; })()],["user_id.login","=",creds.email]]],
          { fields: ["project_id"], limit: 500 }]])
      ]);
      setMonthlyHours((monthEntries||[]).reduce((s,e) => s+(e.unit_amount||0), 0));
      setRecentProjectIds(new Set((recentEntries||[]).map(e => e.project_id?.[0]).filter(Boolean)));
    } catch {}
  }

  async function refreshMonthlyHours() {
    if (!uid || !creds) return;
    try {
      const now = new Date();
      const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-01`;
      const entries = await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "search_read",
        [[["date",">=",monthStart],["date","<=",todayISO()],["user_id.login","=",creds.email]]],
        { fields: ["unit_amount"], limit: 2000 }]]);
      setMonthlyHours((entries||[]).reduce((s,e) => s+(e.unit_amount||0), 0));
    } catch {}
  }

  async function fetchMonthsData() {
    if (!uid || !creds) return;
    setMonthsLoading(true);
    try {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth() - 12, 1);
      const startStr = `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,"0")}-01`;
      const entries = await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "search_read",
        [[["date",">=",startStr],["date","<=",todayISO()],["user_id.login","=",creds.email]]],
        { fields: ["date","unit_amount"], limit: 5000 }]]);
      const byMonth = {};
      (entries||[]).forEach(e => { const k = e.date.slice(0,7); byMonth[k] = (byMonth[k]||0) + (e.unit_amount||0); });
      const months = [];
      for (let i = 12; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
        months.push({ key, year: d.getFullYear(), month: d.getMonth(), hours: byMonth[key] || 0 });
      }
      setMonthsData(months);
    } catch {}
    setMonthsLoading(false);
  }

  async function handleAIParse() {
    if (!aiInput.trim()) return;
    if (!anthropicKey) { setAiError("Add your Anthropic API key in Settings."); return; }
    setAiLoading(true); setAiError(""); setParsedEntries([]);
    try {
      const projectList = projects.map(p => `${p.id}: ${p.name}`).join("\n") || "No projects loaded";
      const taskList = tasks.map(t => `${t.id}: ${t.name} (project: ${t.project_id?.[1] || "none"})`).join("\n") || "No tasks loaded";
      const body = JSON.stringify({
        model: "claude-sonnet-4-20250514", max_tokens: 1000,
        messages: [{ role: "user", content:
          `You are a timesheet assistant. Parse the work summary into time entries.\n\nAvailable Projects:\n${projectList}\n\nAvailable Tasks:\n${taskList}\n\n${userContext ? `User context (use this to map shorthand names/codes to the correct projects and tasks):\n${userContext}\n\n` : ""}Work summary: "${aiInput}"\n\nToday: ${new Date().toISOString().split("T")[0]}\n\nRespond ONLY with a JSON array (no markdown):\n- date: YYYY-MM-DD\n- project_id: number or null\n- project_name: string\n- task_id: number or null\n- task_name: string\n- hours: number\n- description: string`
        }]
      });
      const headers = { "Content-Type": "application/json", "x-api-key": anthropicKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
      let data, attempts = 0;
      while (true) {
        const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body });
        data = await res.json();
        if (res.status === 529 || data.error?.type === "overloaded_error") {
          if (++attempts >= 3) throw new Error("API overloaded — please try again in a moment");
          await new Promise(r => setTimeout(r, attempts * 2000));
          continue;
        }
        break;
      }
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.map(b => b.text || "").join("") || "";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setParsedEntries(parsed.map((e, i) => ({ ...e, _id: i, _checked: true })));
    } catch (e) { setAiError("Parse failed: " + e.message); }
    setAiLoading(false);
  }

  const updateEntry = (i, f, v) => setParsedEntries(prev => prev.map((e, idx) => idx === i ? { ...e, [f]: v } : e));

  async function submitEntries() {
    const toSubmit = parsedEntries.filter(e => e._checked);
    if (!toSubmit.length) return;
    setSubmitStatus("submitting");
    try {
      let id = uid;
      if (!id) {
        id = await odooRPC("call", ["common", "authenticate", [creds.db, creds.email, creds.password, {}]]);
        setUid(id);
      }
      for (const e of toSubmit) {
        const vals = { name: e.description, unit_amount: e.hours, date: e.date, ...(e.project_id ? { project_id: e.project_id } : {}), ...(e.task_id ? { task_id: e.task_id } : {}) };
        await odooRPC("call", ["object", "execute_kw", [creds.db, id, creds.password, "account.analytic.line", "create", [vals]]]);
      }
      const existing = lsLoad("timesheet_history") || [];
      lsSave("timesheet_history", [...existing, ...toSubmit.map(e => ({ ...e, _logged: new Date().toISOString() }))]);
      setSubmitStatus("success"); setParsedEntries([]); setAiInput("");
      refreshCurrentView();
      refreshMonthlyHours();
      setTimeout(() => setSubmitStatus(""), 3000);
    } catch (e) { setSubmitStatus("error: " + e.message); }
  }

  async function submitQuickEntry(date) {
    if (!quickEntry.hours || +quickEntry.hours <= 0) return;
    if (!quickEntry.description.trim()) return;
    setQuickStatus("submitting");
    try {
      const vals = { name: quickEntry.description, unit_amount: +quickEntry.hours, date: date || tableDate, ...(quickEntry.project_id ? { project_id: quickEntry.project_id } : {}), ...(quickEntry.task_id ? { task_id: quickEntry.task_id } : {}) };
      if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "create", [vals]]]);
      const existing = lsLoad("timesheet_history") || [];
      lsSave("timesheet_history", [...existing, { ...vals, _logged: new Date().toISOString() }]);
      lsSave("last_entry", { project_id: quickEntry.project_id, project_name: quickEntry.project_name, task_id: quickEntry.task_id, task_name: quickEntry.task_name });
      setQuickEntry(prev => ({ ...prev, description: "", hours: "" }));
      setQuickStatus("ok");
      setTimeout(() => setQuickStatus(""), 1500);
      refreshCurrentView();
      refreshMonthlyHours();
    } catch (e) { setQuickStatus("error: " + e.message); }
  }

  async function saveEdit() {
    setEditStatus("saving");
    try {
      if (uid && creds && editingId) {
        const vals = { name: editForm.description, unit_amount: +editForm.hours, date: editForm.date, ...(editForm.project_id ? { project_id: editForm.project_id } : {}), ...(editForm.task_id ? { task_id: editForm.task_id } : {}) };
        await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "write", [[editingId], vals]]]);
      }
      setEditingId(null); setEditForm({});
      setEditStatus("");
      refreshCurrentView();
    } catch (e) { setEditStatus("error: " + e.message); }
  }

  async function deleteEntry(entryId) {
    if (!window.confirm("Delete this time entry?")) return;
    try {
      if (uid && creds && entryId) {
        await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "unlink", [[entryId]]]]);
      }
      if (editingId === entryId) { setEditingId(null); setEditForm({}); }
      refreshCurrentView();
    } catch (e) { alert("Delete failed: " + e.message); }
  }

  async function saveCellEdit(row, date, existingEntry) {
    const hours = parseFloat(cellEditVal);
    const isNewRow = row === "__new__";
    const rowData = isNewRow ? quickEntry : row;
    setCellEditKey(null); setCellEditVal("");
    if (isNaN(hours) || hours < 0) { if (!isNewRow) loadWeekEntries(tableDate); return; }
    if (isNewRow && hours > 0) {
      if (!quickEntry.description.trim()) { loadWeekEntries(tableDate); return; }
      lsSave("last_entry", { project_id: quickEntry.project_id, project_name: quickEntry.project_name, task_id: quickEntry.task_id, task_name: quickEntry.task_name });
      setQuickEntry(prev => ({ ...prev, description: "", hours: "" }));
    }
    try {
      if (existingEntry) {
        if (hours === 0) {
          if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "unlink", [[existingEntry.id]]]]);
        } else {
          if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "write", [[existingEntry.id], { unit_amount: hours }]]]);
        }
      } else if (hours > 0) {
        const vals = { name: rowData.description, unit_amount: hours, date, ...(rowData.project_id ? { project_id: rowData.project_id } : {}), ...(rowData.task_id ? { task_id: rowData.task_id } : {}) };
        if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "create", [vals]]]);
      }
      loadWeekEntries(tableDate);
    } catch (e) { alert("Save failed: " + e.message); loadWeekEntries(tableDate); }
  }

  async function saveDescPopup() {
    if (!descPopup) return;
    const { row, day, entries } = descPopup;
    setDescPopup(null);
    try {
      for (const ent of entries) {
        const hours = parseFloat(ent.hours);
        if (ent.id) {
          if (!isNaN(hours) && hours === 0) {
            if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "unlink", [[ent.id]]]]);
          } else if (!isNaN(hours) && hours > 0) {
            if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "write", [[ent.id], { unit_amount: hours, name: ent.desc }]]]);
          }
        } else if (!isNaN(hours) && hours > 0) {
          const vals = { name: ent.desc, unit_amount: hours, date: day, ...(row.project_id ? { project_id: row.project_id } : {}), ...(row.task_id ? { task_id: row.task_id } : {}) };
          if (uid && creds) await odooRPC("call", ["object", "execute_kw", [creds.db, uid, creds.password, "account.analytic.line", "create", [vals]]]);
        }
      }
      loadWeekEntries(tableDate);
    } catch (e) { alert("Save failed: " + e.message); loadWeekEntries(tableDate); }
  }

  function refreshCurrentView() {
    if (tableView === "week") loadWeekEntries(tableDate);
    else loadTableEntries(tableDate);
  }

  async function loadTableEntries(date) {
    setTableLoading(true);
    try {
      if (uid && creds) {
        const entries = await odooRPC("call", ["object", "execute_kw", [
          creds.db, uid, creds.password,
          "account.analytic.line", "search_read",
          [[["date","=",date],["user_id.login","=",creds.email]]],
          { fields: ["date","name","unit_amount","project_id","task_id"], order: "id asc" }
        ]]);
        setTableEntries(entries || []);
      } else {
        const local = lsLoad("timesheet_history") || [];
        setTableEntries(local.filter(e => (e.date || "").startsWith(date)));
      }
    } catch {
      const local = lsLoad("timesheet_history") || [];
      setTableEntries(local.filter(e => (e.date || "").startsWith(date)));
    }
    setTableLoading(false);
  }

  async function loadWeekEntries(date) {
    setWeekLoading(true);
    const days = weekDaysOf(date);
    const start = days[0], end = days[6];
    try {
      if (uid && creds) {
        const entries = await odooRPC("call", ["object", "execute_kw", [
          creds.db, uid, creds.password,
          "account.analytic.line", "search_read",
          [[["date",">=",start],["date","<=",end],["user_id.login","=",creds.email]]],
          { fields: ["date","name","unit_amount","project_id","task_id"], order: "date asc, id asc" }
        ]]);
        setWeekEntries(entries || []);
      } else {
        const local = lsLoad("timesheet_history") || [];
        setWeekEntries(local.filter(e => e.date >= start && e.date <= end));
      }
    } catch {
      const local = lsLoad("timesheet_history") || [];
      setWeekEntries(local.filter(e => e.date >= start && e.date <= end));
    }
    setWeekLoading(false);
  }

    if (tab !== "Log Time") return;
    if (tableView === "week") loadWeekEntries(tableDate);
    else loadTableEntries(tableDate);
  }, [tab, tableView, tableDate, uid]);

                                  </div>
                                  {weekDays.map((day, di) => {
                                    const entries = row.days[day] || [];
                                    const hours = entries.reduce((s,e)=>s+(e.unit_amount||e.hours||0),0);
                                    const isWeekend = di>=5, isToday = day===todayISO();
                                    const cellKey = `${row.key}|${day}`;
                                    const isHovered = rowTooltip === cellKey;
                                    const desc = entries.map(e=>e.name||e.description||"").filter(Boolean).join("; ");
                                    return (
                                      <div key={day} style={{ position:"relative" }}
                                        onMouseEnter={()=>setRowTooltip(cellKey)}
                                        onMouseLeave={()=>setRowTooltip(null)}>

                                          </div>
                                        )}
                                      </div>
                                    );
                                  })}
                                  <div style={{ fontSize:13, fontWeight:700, color:"var(--text)", textAlign:"center" }}>{rowTotal.toFixed(2)}</div>

                                <div key={di} style={{ fontSize:13, fontWeight:600, color:t>0?"var(--text)":"var(--border)", textAlign:"center" }}>{t>0?t.toFixed(2):"—"}</div>

                              <div style={{ fontSize:14, fontWeight:700, color:"var(--text)", textAlign:"center" }}>{weekTotal.toFixed(2)}</div>

                                      <option value="">Task…</option>
                                      {tasks.filter(t=>!quickEntry.project_id||t.project_id?.[0]==quickEntry.project_id).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <input value={quickEntry.description} onChange={e2=>setQuickEntry(p=>({...p,description:e2.target.value}))} placeholder="Description…" style={qInp} />
                                  </div>
                                  {weekDays.map((day,di) => {
                                    const ck = `__new__|${day}`;

                                      <div key={day} style={{ padding:"2px" }}>
                                        <input autoFocus type="number" step="0.25" min="0" value={cellEditVal}
                                          onChange={e2=>setCellEditVal(e2.target.value)}
                                          onBlur={()=>saveCellEdit("__new__",day,null)}
                                          onKeyDown={e2=>{if(e2.key==="Enter")saveCellEdit("__new__",day,null);if(e2.key==="Escape"){setCellEditKey(null);setCellEditVal("");}}}
                                          style={{ width:"100%", background:"var(--input-bg)", border:"1px solid var(--accent)", borderRadius:4, padding:"4px 2px", color:"var(--text)", fontSize:12, outline:"none", textAlign:"center" }} />
                                      </div>
                                    );
                                    return (
                                      <div key={day} onClick={()=>{setCellEditKey(ck);setCellEditVal("");}} style={{ textAlign:"center", fontSize:18, color:"var(--border)", cursor:"pointer", background:isToday?"var(--ok-bg)":isWeekend?"var(--raised)":"transparent", borderRadius:4, padding:"5px 0", userSelect:"none" }}>+</div>
                                    );
                                  })}
                                  <div></div>
                                </div>
                              );
                            })()}
                          </div>
                          </div>
                        );
                      })()
                  )}
                </div>
              );
            })()}
          </div>
        )}

        {tab === "Settings" && (

              </button>

            </div>

            <h2 style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:16 }}>Odoo Login</h2>
            {[
              {key:"url", label:"Odoo URL", placeholder:"https://your-instance.odoo.com", type:"url"},

            ))}

            <hr style={{ border:"none", borderTop:"1px solid var(--border)", margin:"28px 0" }} />
            <h2 style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:6 }}>Anthropic API Key</h2>
            <p style={{ fontSize:13, color:"var(--text-mid)", marginBottom:14 }}>
              Required for AI parsing. Get yours at <a href="https://console.anthropic.com" target="_blank" style={{color:"var(--accent)"}}>console.anthropic.com</a>.
            </p>
            <div style={{ marginBottom:14 }}>
              <label style={lbl}>API Key</label>
              <input type="password" value={sf.anthropicKey} onChange={e => setSf(p=>({...p,anthropicKey:e.target.value}))} placeholder="sk-ant-..." style={inp} />
            </div>

            <hr style={{ border:"none", borderTop:"1px solid var(--border)", margin:"28px 0" }} />
            <h2 style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:6 }}>Personal Context</h2>
            <p style={{ fontSize:13, color:"var(--text-mid)", marginBottom:14 }}>
              Describe your projects, shorthand codes, or preferences. Sent to the AI to help map descriptions to the right entries.
            </p>
            <div style={{ marginBottom:24 }}>
              <textarea value={sf.userContext} onChange={e => setSf(p=>({...p,userContext:e.target.value}))}
                placeholder={"e.g.\n- 'ACME' = Acme Corp Redesign project, task Backend API\n- 'standup' always maps to Internal > Daily Standup\n- I work on the mobile team, default project is Mobile App"}
                style={{ ...inp, minHeight:120, resize:"vertical", lineHeight:1.6 }} />
            </div>

            <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center" }}>
              <button onClick={testConnection} disabled={odooConnecting} style={{ padding:"8px 16px", borderRadius:7, border:"1px solid var(--border)", background:"transparent", color:"var(--text-mid)", cursor:"pointer", fontSize:13, fontWeight:500 }}>
                {odooConnecting ? "Testing…" : "Test Connection"}
              </button>
              <button onClick={saveSettings} style={{ padding:"8px 18px", borderRadius:7, border:"none", background:"var(--accent)", color:"#fff", cursor:"pointer", fontSize:13, fontWeight:600 }}>
                Save to Keychain
              </button>
              <button onClick={clearCredentials} style={{ padding:"8px 16px", borderRadius:7, border:"1px solid var(--err-border)", background:"transparent", color:"var(--err-text)", cursor:"pointer", fontSize:13 }}>
                Clear Keychain
              </button>
              {settingsSaved && <span style={{ color:"var(--ok-text)", fontSize:13 }}>✓ Saved!</span>}
            </div>
            {odooStatus && <div style={{ marginTop:12, fontSize:13, padding:"8px 12px", borderRadius:8, background:"var(--well)", border:"1px solid var(--border)" }}>{odooStatus}</div>}

            <hr style={{ border:"none", borderTop:"1px solid var(--border)", margin:"28px 0" }} />
            <h2 style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:6 }}>Accent Color</h2>
            <p style={{ fontSize:13, color:"var(--text-mid)", marginBottom:14 }}>Choose a color theme for the interface.</p>
            <div style={{ display:"flex", flexWrap:"wrap", gap:10, marginBottom:4 }}>
              {PALETTES.map(p => (
                <button key={p.id} onClick={() => { setPalette(p.id); localStorage.setItem("odoo-tracker-palette", p.id); }}
                  title={p.name}
                  style={{
                    width:30, height:30, borderRadius:"50%",
                    background: p.swatch,
                    border: palette === p.id ? `3px solid var(--text)` : "3px solid transparent",
                    outline: palette === p.id ? `2px solid ${p.swatch}` : "none",
                    outlineOffset:2,
                    cursor:"pointer",
                    flexShrink:0,
                    position:"relative"
                  }}>
                  {palette === p.id && (
                    <span style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:12, fontWeight:700, textShadow:"0 1px 2px rgba(0,0,0,0.4)" }}>✓</span>
                  )}
                </button>
              ))}
            </div>
            <p style={{ fontSize:12, color:"var(--text-lo)", marginTop:8, marginBottom:0 }}>
              {PALETTES.find(p => p.id === palette)?.name}
            </p>

            <hr style={{ border:"none", borderTop:"1px solid var(--border)", margin:"28px 0" }} />
            <h2 style={{ fontSize:13, fontWeight:600, color:"var(--text-mid)", marginBottom:10 }}>Tips</h2>
            <ul style={{ fontSize:13, color:"var(--text-lo)", lineHeight:2, paddingLeft:16 }}>
              <li>Your DB name is usually your subdomain — e.g. <code style={{color:"var(--accent)"}}>mycompany</code> for mycompany.odoo.com</li>
              <li>Visit <code style={{color:"var(--accent)"}}>[your-odoo-url]/web/database/selector</code> to confirm your DB name</li>
              <li>Make sure your Odoo user has <strong>Timesheets</strong> access</li>
            </ul>
          </div>
        )}

      </div>

      {/* ── Monthly Hours Popup ── */}
      {showMonthsPopup && (
        <div onClick={() => setShowMonthsPopup(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div onClick={e => e.stopPropagation()} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:12, padding:28, width:440, maxHeight:"80vh", overflowY:"auto", boxShadow:"var(--shadow)" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
              <h2 style={{ fontWeight:700, fontSize:18, color:"var(--text)" }}>Monthly Hours</h2>
              <button onClick={() => setShowMonthsPopup(false)} style={{ background:"transparent", border:"none", color:"var(--text-lo)", cursor:"pointer", fontSize:18, lineHeight:1, padding:"0 4px" }}>✕</button>
            </div>
            {monthsLoading && <div style={{ textAlign:"center", color:"var(--text-lo)", padding:"32px 0", fontSize:13 }}>Loading…</div>}
            {!monthsLoading && monthsData && (() => {
              const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
              const nowKey = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,"0")}`;
              const currentMonth = monthsData.find(m => m.key === nowKey);
              const pastMonths = monthsData.filter(m => m.key !== nowKey);
              const maxH = Math.max(...pastMonths.map(m => m.hours), currentMonth?.hours || 0, 1);
              const totalPast = pastMonths.reduce((s,m) => s+m.hours, 0);
              const avg = totalPast / 12;

              const MonthRow = ({m}) => {
                const pct = (m.hours / maxH) * 100;
                return (
                  <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 56px", gap:10, alignItems:"center", marginBottom:9 }}>
                    <div style={{ fontSize:13, color:"var(--text-mid)", textAlign:"right" }}>{MONTH_NAMES[m.month]} {m.year}</div>
                    <div style={{ background:"var(--well)", borderRadius:4, height:14, overflow:"hidden" }}>
                      <div style={{ width:`${pct}%`, height:"100%", background:"var(--accent)", borderRadius:4, minWidth: m.hours > 0 ? 3 : 0, opacity:0.6 }} />
                    </div>
                    <div style={{ fontSize:13, color: m.hours > 0 ? "var(--text)" : "var(--border)", textAlign:"right" }}>
                      {m.hours > 0 ? `${m.hours.toFixed(1)}h` : "—"}
                    </div>
                  </div>
                );
              };

              return (
                <>
                  <div style={{ display:"flex", gap:24, marginBottom:24, paddingBottom:20, borderBottom:"1px solid var(--border)" }}>
                    <div>
                      <div style={{ fontSize:11, color:"var(--text-lo)", textTransform:"uppercase", fontWeight:700, letterSpacing:"0.06em", marginBottom:4 }}>12-month total</div>
                      <div style={{ fontSize:22, fontWeight:700, color:"var(--text)" }}>{totalPast.toFixed(1)}h</div>
                    </div>
                    <div style={{ width:1, background:"var(--border)" }} />
                    <div>
                      <div style={{ fontSize:11, color:"var(--text-lo)", textTransform:"uppercase", fontWeight:700, letterSpacing:"0.06em", marginBottom:4 }}>avg / month</div>
                      <div style={{ fontSize:22, fontWeight:700, color:"var(--text)" }}>{avg.toFixed(1)}h</div>
                    </div>
                  </div>

                  <div style={{ fontSize:11, color:"var(--accent)", textTransform:"uppercase", fontWeight:700, letterSpacing:"0.06em", marginBottom:8 }}>This month · in progress</div>
                  {currentMonth && (() => {
                    const pct = (currentMonth.hours / maxH) * 100;
                    return (
                      <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 56px", gap:10, alignItems:"center", marginBottom:20, padding:"10px 12px", background:"var(--well)", borderRadius:8, border:"1px solid var(--border-accent)" }}>
                        <div style={{ fontSize:13, color:"var(--text)", fontWeight:600, textAlign:"right" }}>{MONTH_NAMES[currentMonth.month]} {currentMonth.year}</div>
                        <div style={{ background:"var(--border-faint)", borderRadius:4, height:14, overflow:"hidden" }}>
                          <div style={{ width:`${pct}%`, height:"100%", background:"var(--accent)", borderRadius:4, minWidth: currentMonth.hours > 0 ? 3 : 0 }} />
                        </div>
                        <div style={{ fontSize:13, fontWeight:700, color:"var(--accent)", textAlign:"right" }}>
                          {currentMonth.hours > 0 ? `${currentMonth.hours.toFixed(1)}h` : "—"}
                        </div>
                      </div>
                    );
                  })()}

                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
                    <div style={{ flex:1, height:1, background:"var(--border)" }} />
                    <div style={{ fontSize:10, color:"var(--text-lo)", textTransform:"uppercase", fontWeight:700, letterSpacing:"0.06em" }}>Last 12 months</div>
                    <div style={{ flex:1, height:1, background:"var(--border)" }} />
                  </div>

                  {[...pastMonths].reverse().map(m => <MonthRow key={m.key} m={m} />)}
                </>
              );
            })()}
          </div>
        </div>
      )}

      {/* ── Desc / Edit Popup (week view) ── */}
      {descPopup && (
        <div onClick={()=>setDescPopup(null)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:12, padding:24, width:460, maxHeight:"80vh", overflowY:"auto", boxShadow:"var(--shadow)" }}>
            <h2 style={{ fontWeight:700, fontSize:16, color:"var(--text)", marginBottom:4 }}>Edit Entries</h2>
            <div style={{ fontSize:12, color:"var(--text-lo)", marginBottom:16 }}>
              {descPopup.row.project_name||"No project"}{descPopup.row.task_name ? ` · ${descPopup.row.task_name}` : ""} · {descPopup.day}
            </div>
            {descPopup.entries.map((ent, idx) => (
              <div key={idx} style={{ display:"flex", gap:8, alignItems:"flex-end", marginBottom:10 }}>
                <div style={{ flex:"0 0 80px" }}>
                  {idx === 0 && <label style={{ fontSize:11, color:"var(--text-lo)", display:"block", marginBottom:3, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.05em" }}>Hours</label>}
                  <input autoFocus={idx===0} type="number" step="0.25" min="0" value={ent.hours}
                    onChange={e=>setDescPopup(p=>({...p,entries:p.entries.map((e2,i)=>i===idx?{...e2,hours:e.target.value}:e2)}))}
                    onKeyDown={e=>{if(e.key==="Escape")setDescPopup(null);}}
                    style={{ width:"100%", background:"var(--input-bg)", border:"1px solid var(--border)", borderRadius:7, padding:"8px 10px", color:"var(--text)", fontSize:13, outline:"none" }} />
                </div>
                <div style={{ flex:1 }}>
                  {idx === 0 && <label style={{ fontSize:11, color:"var(--text-lo)", display:"block", marginBottom:3, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.05em" }}>Description</label>}
                  <input value={ent.desc}
                    onChange={e=>setDescPopup(p=>({...p,entries:p.entries.map((e2,i)=>i===idx?{...e2,desc:e.target.value}:e2)}))}
                    onKeyDown={e=>{if(e.key==="Enter"&&e.metaKey){e.preventDefault();saveDescPopup();}if(e.key==="Escape")setDescPopup(null);}}
                    style={{ width:"100%", background:"var(--input-bg)", border:"1px solid var(--border)", borderRadius:7, padding:"8px 10px", color:"var(--text)", fontSize:13, outline:"none" }} />
                </div>
              </div>
            ))}
            <button onClick={()=>setDescPopup(p=>({...p,entries:[...p.entries,{id:null,hours:"",desc:""}]}))}
              style={{ width:"100%", background:"transparent", border:"1px dashed var(--border)", borderRadius:7, color:"var(--text-lo)", cursor:"pointer", fontSize:12, padding:"7px 0", marginBottom:14, marginTop:2 }}>
              + Add entry
            </button>
            <div style={{ fontSize:11, color:"var(--text-lo)", marginBottom:12 }}>⌘↵ to save · Esc to cancel</div>
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button onClick={()=>setDescPopup(null)} style={{ padding:"8px 16px", borderRadius:7, border:"1px solid var(--border)", cursor:"pointer", background:"transparent", color:"var(--text-mid)", fontSize:13 }}>Cancel</button>
              <button onClick={saveDescPopup} style={{ padding:"8px 20px", borderRadius:7, border:"none", cursor:"pointer", background:"var(--accent)", color:"#fff", fontWeight:600, fontSize:13 }}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
